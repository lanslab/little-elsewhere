name: Prepare Pupu download panel

on:
  push:
    paths:
      - '.github/workflows/prepare-pupu-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire release panel into index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          head_marker = '<!-- PUPU_RELEASE_HEAD -->'
          body_marker = '<!-- PUPU_RELEASE_BODY -->'

          if head_marker not in html:
              head_insert = f'''\n  {head_marker}\n  <link rel="stylesheet" href="./pupu-downloads.css">\n'''
              html = html.replace('</head>', head_insert + '</head>', 1)

          if body_marker not in html:
              body_insert = f'''\n  {body_marker}\n  <script src="./pupu-release-links.js"></script>\n  <script src="./pupu-downloads.js"></script>\n'''
              html = html.replace('</body>', body_insert + '</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit generated wiring
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire Pupu release panel into website"
          git push
